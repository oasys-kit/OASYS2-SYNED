[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OASYS2-SYNED"
version = "1.0.12"
description = "SYNED SYNchrotron Elements Dictionary"
readme = "README.md"

# TODO: confirm the exact GPL variant (the old setup.py just said 'GPLv3',
# and there is no License:: classifier here to cross-check against).
# NOTE: the sibling `syned` kernel package declares GPLv3 but ships an MIT
# LICENSE file -- worth settling both at the same time.
license = "GPL-3.0-or-later"
# license = "GPL-3.0-only"      # <- if the source headers say "version 3" only
# license-files = ["LICENSE"]   # <- uncomment if a LICENSE file exists in the repo

authors = [
    { name = "Manuel Sanchez del Rio", email = "srio@esrf.eu" },
    { name = "Luca Rebuffi", email = "lrebuffi@anl.gov" },
]
keywords = [
    "simulator",
    "oasys2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "oasys2>=0.0.55",
    "syned-gui-2>=1.0.4",
]

[project.urls]
Homepage = "https://github.com/oasys-kit/OASYS2-SYNED"
Download = "https://github.com/oasys-kit/OASYS2-SYNED"

[project.entry-points."oasys2.addons"]
syned = "orangecontrib.syned"

[project.entry-points."oasys2.widgets"]
"Syned: Light Sources" = "orangecontrib.syned.widgets.light_sources"
"Syned: Optical Elements" = "orangecontrib.syned.widgets.beamline_elements"
"Syned: Tools" = "orangecontrib.syned.widgets.tools"
"Syned: Loops" = "orangecontrib.syned.widgets.loops"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]
# namespaces = false replicates the old find_packages() behaviour exactly.
# Under pyproject.toml, setuptools DEFAULTS this to true (= find_namespace_packages),
# which would sweep in non-package dirs such as .../icons and .../misc.
namespaces = false

[tool.setuptools.package-data]
"orangecontrib.syned.widgets.light_sources" = ["icons/*.png", "icons/*.jpg"]
"orangecontrib.syned.widgets.beamline_elements" = ["icons/*.png", "icons/*.jpg"]
"orangecontrib.syned.widgets.tools" = ["icons/*.png", "icons/*.jpg", "misc/*.png"]
"orangecontrib.syned.widgets.loops" = ["icons/*.png", "icons/*.jpg", "misc/*.png"]